apiVersion: v1
kind: ConfigMap
metadata:
  name: artemis-broker-config
  namespace: artemis
data:
  broker.xml: |
      <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
      <configuration xmlns="urn:activemq"
                     xmlns:xi="http://www.w3.org/2001/XInclude"
                     xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                     xsi:schemaLocation="urn:activemq /schema/artemis-configuration.xsd">
      
         <core xmlns="urn:activemq:core" xsi:schemaLocation="urn:activemq:core">
      
            <name>artemis-k8s</name>
      
            <persistence-enabled>true</persistence-enabled>
            <journal-type>ASYNCIO</journal-type>
            <paging-directory>/var/lib/artemis-instance/data/paging</paging-directory>
            <bindings-directory>/var/lib/artemis-instance/data/bindings</bindings-directory>
            <journal-directory>/var/lib/artemis-instance/data/journal</journal-directory>
            <large-messages-directory>/var/lib/artemis-instance/data/large-messages</large-messages-directory>
             
             <connectors>
                 <!-- Netty connector via de vereenvoudigde URI-syntax -->
                 <connector name="netty-connector">tcp://0.0.0.0:61616</connector>
             </connectors>
      
            <acceptors>
                <acceptor name="netty-acceptor">tcp://0.0.0.0:61616</acceptor>
            </acceptors>
             
            <security-settings>
                <security-setting match="IN_Q">
                    <permission type="createAddress" roles="amq"/>
                    <permission type="deleteAddress" roles="amq"/>
                    <permission type="createQueue" roles="amq"/>
                    <permission type="deleteQueue" roles="amq"/>
                    <permission type="send" roles="amq"/>
                    <permission type="consume" roles="amq"/>
                    <permission type="browse" roles="amq"/>
                </security-setting>
               <security-setting match="#">
                  <permission type="createNonDurableQueue" roles="artemis"/>
                  <permission type="deleteNonDurableQueue" roles="artemis"/>
                  <permission type="createDurableQueue" roles="artemis"/>
                  <permission type="deleteDurableQueue" roles="artemis"/>
                  <permission type="send" roles="artemis"/>
                  <permission type="consume" roles="artemis"/>
                  <permission type="browse" roles="artemis"/>
                  <permission type="manage" roles="artemis"/>
               </security-setting>
            </security-settings>
      
            <addresses>
              <address name="IN_Q">
                <anycast>
                  <queue name="IN_Q"/>
                </anycast>
              </address>
            </addresses>
   
            <cluster-password>${cluster.password:CHANGE_ME}</cluster-password>
      
        <!-- We matchen hiermee absoluut ALLES om andere defaults te overrulem -->
            <address-settings>
                <!-- We targeten exact de queue/adresnaam uit je console -->
                <address-setting match="IN_Q">
                    <address-full-policy>PAGE</address-full-policy>
                    
                    <!-- We zetten de limiet op 10 MB (10485760 bytes). 
                         Jouw 100 MB aan berichten zal hier direct doorheen knallen! -->
                    <max-size-bytes>10485760</max-size-bytes>
                    
                    <!-- Pagina bestanden van 2 MB -->
                    <page-size-bytes>2097152</page-size-bytes>
                    
                    <page-max-cache-size>5</page-max-cache-size>
                    
                    <auto-create-addresses>true</auto-create-addresses>
                    <auto-create-queues>true</auto-create-queues>
                </address-setting>
              </address-settings>
            
            <!-- Zorg dat de globale broker limiet ook laag staat, bijv. 20 MB -->
            <global-max-size>20971520</global-max-size>
         </core>
      </configuration>
